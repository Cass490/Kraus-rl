[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-unitary-synthesis"
version = "0.1.0"
description = "Phase-carry and paired-word methods for quantum unitary synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pygridsynth==2.0.0",
    "mpmath==1.4.1",
]

[project.optional-dependencies]
native = ["maturin==1.15.0"]
pennylane = ["pennylane==0.42.3", "pennylane-lightning==0.42.0"]

[project.scripts]
parity-synthesis = "parity_synthesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
